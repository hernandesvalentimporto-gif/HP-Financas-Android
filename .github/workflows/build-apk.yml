name: Gerar APK HP Finanças

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e extrair o ZIP correto
        run: |
          ZIP="./HP_Financas_Projeto_ICONe_FARIA_LIMA.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP novo não encontrado na raiz do repositório."
            exit 1
          fi

          mkdir -p /tmp/hp-project
          unzip -q "$ZIP" -d /tmp/hp-project

          SETTINGS=$(find /tmp/hp-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: o ZIP não contém settings.gradle ou settings.gradle.kts."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          echo "Projeto selecionado: $(dirname "$SETTINGS")"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Disponibilizar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: HP-Financas-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
