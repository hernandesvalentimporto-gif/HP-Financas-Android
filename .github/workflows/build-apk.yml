name: Gerar APK HP Finanças

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar HP Finanças
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e extrair projeto
        shell: bash
        run: |
          set -e

          mkdir -p projeto

          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::Nenhum arquivo ZIP encontrado na raiz do repositório."
            exit 1
          fi

          echo "Arquivo encontrado: $ZIP"
          unzip -o "$ZIP" -d projeto

          echo "Conteúdo extraído:"
          find projeto -maxdepth 4 -type f | head -n 100

       - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar projeto Android
        id: projeto
        shell: bash
        run: |
          set -e

          ROOT=$(find projeto -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$ROOT" ]; then
            echo "::error::Não foi encontrado settings.gradle ou settings.gradle.kts dentro do ZIP."
            exit 1
          fi

          ROOT=$(dirname "$ROOT")
          echo "dir=$ROOT" >> "$GITHUB_OUTPUT"

          echo "Projeto Android localizado em: $ROOT"

          if [ ! -f "$ROOT/gradlew" ]; then
            echo "Não existe gradlew. Será utilizado o Gradle instalado."
          fi

      - name: Compilar APK
        shell: bash
        working-directory: .
        run: |
          set -e

          cd "${{ steps.projeto.outputs.dir }}"

          gradle --version
          gradle assembleDebug --stacktrace

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -e

          APK=$(find "${{ steps.projeto.outputs.dir }}" \
            -type f -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::A compilação terminou sem gerar um APK de depuração."
            exit 1
          fi

          echo "APK gerado: $APK"
          mkdir -p entrega
          cp "$APK" entrega/HP-Financas.apk

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: HP-Financas-APK
          path: entrega/HP-Financas.apk
          if-no-files-found: error
          retention-days: 7
