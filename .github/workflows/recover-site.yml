name: Recuperar site PHP via FTP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      REMOTE_PATH: controle_pessoal
    steps:
      - name: Instalar cliente FTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Baixar arquivos do site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          chmod 700 site
          echo "Listando a pasta remota autorizada..."
          curl --fail --show-error --silent --ftp-pasv \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "ftp://$FTP_HOST/$REMOTE_PATH/" | sed -n '1,120p'
          wget --mirror --no-host-directories --cut-dirs=1 --continue \
            --ftp-user="$FTP_USERNAME" --ftp-password="$FTP_PASSWORD" \
            "ftp://$FTP_HOST/$REMOTE_PATH/" -P site
          test -n "$(find site -type f -print -quit)"
          find site -type f -printf '%P\n' | sort | sed -n '1,200p'

      - name: Compactar backup
        run: tar -czf hp-financas-site-backup.tar.gz -C site .

      - name: Disponibilizar backup como artefato privado
        uses: actions/upload-artifact@v4
        with:
          name: hp-financas-site-backup
          path: hp-financas-site-backup.tar.gz
          retention-days: 3
          if-no-files-found: error
