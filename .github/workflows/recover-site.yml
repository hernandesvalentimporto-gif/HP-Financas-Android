name: Recuperar site PHP via FTP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ftp.sistemashp.com.br
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      REMOTE_PATH: public_html/controle_pessoal
    steps:
      - name: Instalar cliente FTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Baixar arquivos do site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          chmod 700 site
          lftp "ftp://$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20s
          set ftp:passive-mode true
          set ftp:ssl-force false
          set ftp:ssl-protect-data false
          set cmd:trace true
          debug 3
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          pwd
          ls -la
          mirror --verbose --continue --no-perms "$REMOTE_PATH" site
          bye
          LFTP
          test -n "$(find site -type f -print -quit)"
          find site -type f -printf '%P\n' | sort | sed -n '1,200p'

      - name: Compactar backup
        run: tar -czf hp-financas-site-backup.tar.gz -C site .

      - name: Disponibilizar backup como artefato privado
        uses: actions/upload-artifact@v4
        with:
          name: hp-financas-site-backup
          path: hp-financas-site-backup.tar.gz
          retention-days: 3
          if-no-files-found: error
